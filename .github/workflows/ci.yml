name: CI

# Every PR and push: lint, typecheck, unit, config check, build, dry-run bundles for
# each env, and the Playwright suite against local `wrangler dev` (no CMS running, so
# pages render from built-in content: the "CMS down" path is exercised on every run).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit, build, E2E (local)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/www
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Typecheck (astro check + scripts)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: wrangler config check
        run: npm run check:config

      - name: Vendored Fanous themes match the lock (scripts/sync-fanous.ts)
        run: npm run check:fanous

      - name: Build
        run: npm run build

      # Bundles only, no Cloudflare credentials needed
      - name: Dry-run bundles (production, stage, qa)
        run: |
          npx wrangler deploy --dry-run -c wrangler.jsonc --outdir dist-dry/production
          npx wrangler deploy --dry-run -c wrangler.jsonc --env stage --outdir dist-dry/stage
          npx wrangler deploy --dry-run -c wrangler.jsonc --env qa --outdir dist-dry/qa

      - name: Artifact secret scanner self-test
        run: python3 ../../scripts/scan-artifacts-for-secrets.py --self-test

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-install
        with:
          runner: npx
          browsers: chromium webkit
      # playwright.config.ts starts `wrangler dev` (scripts/dev-vars.ts writes a throwaway .dev.vars)
      - name: E2E against local wrangler dev
        run: npx playwright test

      # Public repo: artifacts are downloadable by anyone. Never upload a secret
      # (Playwright puts typed values in traces and report step titles) or a storage state.
      - name: Keep secrets out of the uploaded E2E output
        if: always()
        run: python3 ../../scripts/scan-artifacts-for-secrets.py --remove e2e-artifacts playwright-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-local
          path: |
            apps/www/e2e-artifacts/
            apps/www/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
