name: Rollback

# One-click rollback: puts the www Worker back on the version it served before its
# latest deployment, or on a given version, then smokes.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [production, stage]
        default: production
      version:
        description: Version id to roll back to (optional)
        type: string
        required: false
      reason:
        description: Why (shown in the Cloudflare deployment history)
        type: string
        default: rollback from GitHub Actions
      dry_run:
        description: Dry run (resolve and print the target version, move no traffic)
        type: boolean
        default: false

permissions:
  contents: read

# Never run alongside a release (it would race the promote)
concurrency:
  group: www-release
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back www (${{ inputs.environment }})${{ inputs.dry_run && ' [dry run]' || '' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Inputs go through env, never interpolated into the script
      - name: Roll back and smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--env "$ENVIRONMENT" --reason "$REASON (by $GITHUB_ACTOR)")
          if [ -n "$VERSION" ]; then args+=(--to "$VERSION"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node --experimental-strip-types --no-warnings scripts/release/rollback.ts "${args[@]}"
