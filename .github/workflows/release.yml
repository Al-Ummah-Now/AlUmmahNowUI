name: Release

# Stage-then-promote, the same shape as AlUmmahNowAuth release.yml:
#   resolve (tag on main?) → build once → stage (secrets check, promote with 0% override smoke, E2E)
#   → production (tag-still-here guard, secrets check, 0% + override smoke, 100%,
#     smoke incl. apex → www, auto-rollback, release-result.json, rollback dry run).
# When production moves is decided by a tag (monorepo CLAUDE.md "Deploy Rules"; AlUmmahNow #286):
#   - push a tag vYYYY.MM.DD (vYYYY.MM.DD.N, N >= 2, for a later release that day) on a commit on
#     main → stage → stage E2E → production. Merging to main deploys QA only (deploy-qa.yml).
#   - workflow_dispatch on main → stage and stage E2E only; it never touches production.
# A tag with a bad name, or on a commit that is not on main, is refused before anything deploys.
# To re-run a failed release, re-run that tag's workflow run; never move a tag.
# Repo settings this relies on: the stage environment allows main and v* tags, production allows
# v* tags only, and a tag ruleset restricts who may create v* tags.
# www binds the CMS Worker of the same env (service binding CMS), so a brand-new env needs its
# CMS Worker released first.
# Rollback: .github/workflows/rollback.yml or `npm run release:rollback -- --env production`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled half-way through a promote
concurrency:
  group: www-release
  cancel-in-progress: false

# The Cloudflare token is set only on steps that call Cloudflare, never on install/build
# steps (dependency lifecycle scripts run there).

jobs:
  # Decides what this run is: a tag release (stage → production) or a stage-only run from main.
  # Refuses anything else before a single build minute is spent.
  resolve:
    name: Resolve release (tag on main?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.kind.outputs.tag }}
      production: ${{ steps.kind.outputs.production }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all tags and origin/main, for the ancestry check and the changelog

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Tag release or stage-only run?
        id: kind
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            { echo "tag=$GITHUB_REF_NAME"; echo "production=true"; } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "### Stage-only run of main@${GITHUB_SHA::7}. Production is released by pushing a tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Releases run from a tag (production) or from main (stage only), not from $GITHUB_REF."
            exit 1
          fi

      - name: Valid tag on main?
        id: check
        if: steps.kind.outputs.production == 'true'
        run: node --experimental-strip-types --no-warnings scripts/release/release-tag.ts check "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Changes in this release
        if: steps.kind.outputs.production == 'true'
        env:
          PREV: ${{ steps.check.outputs.previous }}
        run: |
          {
            echo "### Release $GITHUB_REF_NAME (${GITHUB_SHA::7})"
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"; echo '```'; git log --oneline --no-decorate "$PREV..$GITHUB_SHA"; echo '```'
            else
              echo "First tagged release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build once
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Checks (lint, typecheck, unit, wrangler config)
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run check:config

      # The Astro build is env-independent (env comes from vars at runtime):
      # the same dist/ is uploaded to stage and production.
      - name: Build
        run: npm run build

      - name: Dry-run bundles per env
        run: |
          npx wrangler deploy --dry-run -c wrangler.jsonc --outdir dist-dry/production
          npx wrangler deploy --dry-run -c wrangler.jsonc --env stage --outdir dist-dry/stage

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          include-hidden-files: true
          retention-days: 30

  stage:
    name: Stage (promote, E2E)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: stage
      url: https://www.stage.alummahnow.net
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Secrets check (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm run --silent check:secrets -- --env stage | tee secrets-check.txt
          status=${PIPESTATUS[0]}
          { echo '### Secrets check (stage)'; echo '```'; cat secrets-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Same mechanics as production, so every release rehearses the promote
      - name: Promote to stage (0% + override smoke → 100% → smoke)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run release:promote -- --env stage --message "release ${GITHUB_SHA::7}"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E against stage
        env:
          WWW_URL: https://www.stage.alummahnow.net
          E2E_AUTH_URL: https://auth.stage.alummahnow.net
          E2E_CLIENT_ID: d34701ed-03de-43f8-95a8-91cd1e1874bb
          STAGE_SEED_PASSWORD: ${{ secrets.STAGE_SEED_PASSWORD }}
        run: npx playwright test

      # Public repo: artifacts are downloadable by anyone. Never upload a secret
      # (Playwright puts typed values in traces and report step titles) or a storage state.
      - name: Keep secrets out of the uploaded E2E output
        if: always()
        env:
          STAGE_SEED_PASSWORD: ${{ secrets.STAGE_SEED_PASSWORD }}
        run: python3 scripts/scan-artifacts-for-secrets.py --env STAGE_SEED_PASSWORD --remove e2e-artifacts playwright-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-stage
          path: |
            e2e-artifacts/
            playwright-report/
            release-result.json
          if-no-files-found: ignore
          retention-days: 14

  production:
    name: Production (0% smoke, promote, auto-rollback)
    needs: [resolve, stage]
    if: needs.resolve.outputs.production == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.alummahnow.net
    steps:
      - uses: actions/checkout@v6

      # The release deploys exactly the tagged commit, so later merges to main don't matter. A tag
      # that was deleted or moved while stage ran is not promoted.
      - name: Tag still points at this commit?
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          now=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$now" ] || now=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ "$now" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at '${now::7}', not ${GITHUB_SHA::7}; not promoting. Tags are never moved: cut a new tag."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Secrets check (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm run --silent check:secrets -- --env production | tee secrets-check.txt
          status=${PIPESTATUS[0]}
          { echo '### Secrets check (production)'; echo '```'; cat secrets-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Smoke includes apex → www (301, path and query kept) and both hosts over HTTPS
      - name: Promote (0% + override smoke → 100% → smoke, auto-rollback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run release:promote -- --env production --message "release ${{ needs.resolve.outputs.tag }} (${GITHUB_SHA::7})"

      - name: Summary
        if: always()
        run: |
          if [ -f release-result.json ]; then
            { echo '### Production release'; echo '```json'; cat release-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Proves the rollback path resolves (target version, command) without moving traffic
      - name: Rollback dry run
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if jq -e '.released[0].previous' release-result.json > /dev/null; then
            npm run --silent release:rollback -- --env production --dry-run --from-result release-result.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "First deploy: nothing to roll back to" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result
          path: release-result.json
          if-no-files-found: ignore
          retention-days: 90
