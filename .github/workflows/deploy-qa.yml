name: Deploy QA

# Every push to main deploys www to QA (https://www.qa.alummahnow.net) and smokes it. The
# Playwright suite runs against QA only when started by hand with e2e: owner rule (2026-11-13),
# tests run against QA only on numbered releases (QA's D1 read volume); the release's stage E2E
# (release.yml) is the gate.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Also run the Playwright suite against QA'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: www-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy, smoke (QA)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/www
    timeout-minutes: 30
    environment:
      name: qa
      url: https://www.qa.alummahnow.net
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
        working-directory: .

      - run: npm run build

      - name: Secrets check (qa)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:secrets -- --env qa

      - name: Deploy to QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.jsonc --env qa --message "qa ${GITHUB_SHA::7}"

      - name: Smoke /healthz
        run: |
          for _ in $(seq 1 20); do
            if body=$(curl -fsS https://www.qa.alummahnow.net/healthz); then echo "$body"; exit 0; fi
            sleep 3
          done
          echo "::error::QA /healthz did not answer"; exit 1

      - name: Release smoke (qa)
        run: npm run release:smoke -- --env qa

      - name: Install Playwright browsers
        if: inputs.e2e
        uses: ./.github/actions/playwright-install
        with:
          runner: npx
          browsers: chromium webkit
      - name: E2E against QA
        if: inputs.e2e
        env:
          WWW_URL: https://www.qa.alummahnow.net
          E2E_AUTH_URL: https://auth.qa.alummahnow.net
          E2E_CLIENT_ID: ecda6f18-89cb-415c-b746-7e77184d75a2
          E2E_EXPECT_TITLE: ${{ vars.E2E_EXPECT_TITLE }}
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
        run: npx playwright test

      # Public repo: artifacts are downloadable by anyone. Never upload a secret
      # (Playwright puts typed values in traces and report step titles) or a storage state.
      - name: Keep secrets out of the uploaded E2E output
        if: always() && inputs.e2e
        env:
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
        run: python3 ../../scripts/scan-artifacts-for-secrets.py --env QA_SEED_PASSWORD --remove e2e-artifacts playwright-report

      - uses: actions/upload-artifact@v4
        if: always() && inputs.e2e
        with:
          name: screenshots-qa
          path: |
            apps/www/e2e-artifacts/
            apps/www/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
