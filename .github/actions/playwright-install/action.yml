name: Install Playwright browsers (cached, retried)
description: >-
  Installs Playwright browsers and their OS packages without letting one bad apt
  mirror fail the job (2026-11-11: three attempts of Admin E2E failed in
  "playwright install --with-deps" with apt exit 100 before any test ran).
  Browser downloads are cached per Playwright version and browser list; apt uses
  a mirror that answers (apt-install/apt-setup.sh switches away from a dead
  default); every step is time-boxed and retried.

inputs:
  browsers:
    description: 'Space-separated browsers (chromium, chrome, firefox, webkit)'
    required: true
  working-directory:
    description: 'Where the project with @playwright/test is'
    required: false
    default: '.'
  runner:
    description: 'How to run the playwright CLI there (pnpm exec, npx)'
    required: false
    default: 'pnpm exec'

runs:
  using: composite
  steps:
    # A Ubuntu mirror that answers, for this and every later apt call in the job
    - name: apt mirror
      shell: bash
      run: bash "${{ github.action_path }}/../apt-install/apt-setup.sh"

    - name: Playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        v=$(${{ inputs.runner }} playwright --version | awk '{print $NF}')
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "browsers-key=$(echo '${{ inputs.browsers }}' | tr ' ' '\n' | sort | tr '\n' '-')" >> "$GITHUB_OUTPUT"

    - name: Cache browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.browsers-key }}

    # Downloads (from the cache when it hit); Google Chrome (`chrome`) installs through apt here
    - name: Browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        for attempt in 1 2 3; do
          timeout 600 ${{ inputs.runner }} playwright install ${{ inputs.browsers }} && exit 0
          echo "::warning::playwright install failed (attempt $attempt), retrying"
          sleep $((attempt * 15))
          bash "${{ github.action_path }}/../apt-install/apt-setup.sh" || true
        done
        exit 1

    # The browsers' OS packages: always apt (not cacheable), so retried with a fresh index
    - name: OS dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        for attempt in 1 2 3; do
          bash "${{ github.action_path }}/../apt-install/apt-setup.sh" \
            && timeout 900 ${{ inputs.runner }} playwright install-deps ${{ inputs.browsers }} && exit 0
          echo "::warning::playwright install-deps failed (attempt $attempt), retrying"
          sleep $((attempt * 15))
        done
        exit 1
