name: apt-get install (mirror fallback, retried)
description: >-
  Installs Ubuntu packages without letting one bad mirror fail or hang the job
  (2026-11-11: azure.archive.ubuntu.com stopped resolving; release
  v2026.11.11.5 and several E2E jobs failed with apt exit 100 or hung).
  apt-setup.sh finds a mirror that answers; the install is time-boxed and
  retried, with the mirror re-checked between attempts.

inputs:
  packages:
    description: 'Space-separated package names (globs such as ./dist/*.deb allowed)'
    required: true
  no-install-recommends:
    description: 'Pass --no-install-recommends'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: apt-get install ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
        SETUP: ${{ github.action_path }}/apt-setup.sh
      run: |
        extra=()
        [ "$NO_RECOMMENDS" = true ] && extra+=(--no-install-recommends)
        for attempt in 1 2 3; do
          # shellcheck disable=SC2086 # PACKAGES is a word list (and may hold a glob)
          if bash "$SETUP" && timeout 600 sudo apt-get install -y -qq "${extra[@]}" $PACKAGES; then exit 0; fi
          echo "::warning::apt-get install $PACKAGES failed (attempt $attempt), retrying"
          sleep $((attempt * 15))
        done
        exit 1
